on:
  push:
    branches:
      - feature/pkcs11_support
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libssl-dev ninja-build opensc pkcs11-provider softhsm2

      - name: Initialize SoftHSM token
        env:
          TOKEN_PIN: "123456"
        run: |
          mkdir -p "${RUNNER_TEMP}/softhsm/tokens"
          printf 'directories.tokendir = %s\n' \
            "${RUNNER_TEMP}/softhsm/tokens" \
            > "${RUNNER_TEMP}/softhsm/softhsm2.conf"
          export SOFTHSM2_CONF="${RUNNER_TEMP}/softhsm/softhsm2.conf"
          echo "SOFTHSM2_CONF=${SOFTHSM2_CONF}" >> "${GITHUB_ENV}"

          softhsm_module="$(dpkg -L libsofthsm2 | \
            sed -n '/\/libsofthsm2\.so$/p' | head -n 1)"
          provider_module="$(dpkg -L pkcs11-provider | \
            sed -n '/\/pkcs11\.so$/p' | head -n 1)"
          test -n "${softhsm_module}"
          test -n "${provider_module}"

          cat > "${RUNNER_TEMP}/softhsm/openssl.cnf" <<EOF
          openssl_conf = openssl_init

          [openssl_init]
          providers = providers

          [providers]
          default = default_provider
          pkcs11 = pkcs11_provider

          [default_provider]
          activate = 1

          [pkcs11_provider]
          module = ${provider_module}
          pkcs11-module-path = ${softhsm_module}
          activate = 1
          EOF
          export OPENSSL_CONF="${RUNNER_TEMP}/softhsm/openssl.cnf"
          echo "OPENSSL_CONF=${OPENSSL_CONF}" >> "${GITHUB_ENV}"

          softhsm2-util --init-token --free --label NanoMQ \
            --so-pin 12345678 --pin "${TOKEN_PIN}"
          pkcs11-tool --module "${softhsm_module}" --login \
            --pin "${TOKEN_PIN}" --token-label NanoMQ \
            --keypairgen --key-type rsa:2048 --id 01 \
            --label bridge-key --usage-sign

          key_uri='pkcs11:token=NanoMQ;object=bridge-key;type=private'
          openssl req -new -x509 \
            -key "${key_uri};pin-value=${TOKEN_PIN}" \
            -out "${RUNNER_TEMP}/softhsm/bridge-cert.pem" \
            -days 1 -subj '/CN=localhost' \
            -addext 'subjectAltName=DNS:localhost'
          openssl x509 -in "${RUNNER_TEMP}/softhsm/bridge-cert.pem" \
            -outform DER -out "${RUNNER_TEMP}/softhsm/bridge-cert.der"
          pkcs11-tool --module "${softhsm_module}" --login \
            --pin "${TOKEN_PIN}" --token-label NanoMQ \
            --write-object "${RUNNER_TEMP}/softhsm/bridge-cert.der" \
            --type cert --id 01 --label bridge-cert

          {
            echo "NANOMQ_PKCS11_CERT_URI=pkcs11:token=NanoMQ;object=bridge-cert;type=cert"
            echo "NANOMQ_PKCS11_KEY_URI=pkcs11:token=NanoMQ;object=bridge-key;type=private"
            echo "NANOMQ_PKCS11_CA_URI=pkcs11:token=NanoMQ;object=bridge-cert;type=cert"
            echo "NANOMQ_PKCS11_PIN=${TOKEN_PIN}"
          } >> "${GITHUB_ENV}"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DNANOMQ_TESTS=ON \
            -DNNG_ENABLE_TLS=ON \
            -DNNG_TLS_ENGINE=open \
            -DNNG_REQUIRE_PKCS11_PROVIDER=ON

      - name: Build
        run: cmake --build build --target bridge_pkcs11_test

      - name: Test
        run: ctest --test-dir build --output-on-failure -R 'nanomq\.bridge_pkcs11_test$'
